name: Phase acceptance
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cafe_pos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cafe_pos
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cafe_pos" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://cafe_pos:ci-only-password@localhost:5432/cafe_pos
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      CSRF_SECRET: ci-only-csrf-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm prisma generate
      - run: corepack pnpm build
      - run: corepack pnpm typecheck
      - run: corepack pnpm lint
      - run: corepack pnpm test
      - run: corepack pnpm prisma migrate deploy
      - run: node scripts/ci-acceptance.cjs
